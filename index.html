  <style>
:root {
  color-scheme: dark;
  --bg: #050a08;
  --text: #f3f8f3;
  --text-soft: #d4dfd8;
  --muted: #82958c;
  --muted-dim: #5f7068;
  --accent: #c7f36b;
  --accent-bright: #dcff93;
  --accent-deep: #a8da4e;
  --warm: #ffb37c;
  --danger: #ff8f7a;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.13);
  --font-ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --font-display: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --font-mono: "Cascadia Mono", "Consolas", "SFMono-Regular", monospace;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  min-height: 100svh;
  margin: 0;
  padding: 32px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  color: var(--text);
  font-family: var(--font-ui);
  background:
    radial-gradient(900px 680px at 6% -4%, rgba(68, 112, 76, 0.28), transparent 66%),
    radial-gradient(820px 650px at 104% 106%, rgba(145, 88, 46, 0.2), transparent 64%),
    linear-gradient(145deg, #07100d 0%, #040807 52%, #050a08 100%);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.ambient__glow {
  position: absolute;
  display: block;
  border-radius: 50%;
  filter: blur(96px);
  will-change: transform;
}

.ambient__glow--lime {
  width: 520px;
  height: 520px;
  top: -170px;
  left: calc(50% - 520px);
  background: rgba(87, 133, 61, 0.66);
  opacity: 0.42;
  animation: drift-lime 20s ease-in-out infinite alternate;
}

.ambient__glow--amber {
  width: 470px;
  height: 470px;
  right: calc(50% - 500px);
  bottom: -210px;
  background: rgba(154, 88, 41, 0.6);
  opacity: 0.25;
  animation: drift-amber 24s ease-in-out infinite alternate;
}

.ambient__grid {
  position: absolute;
  inset: 0;
  opacity: 0.55;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.024) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
  background-size: 72px 72px;
  -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 46%, #000 10%, transparent 78%);
  mask-image: radial-gradient(ellipse 75% 65% at 50% 46%, #000 10%, transparent 78%);
}

.page {
  position: relative;
  z-index: 1;
  width: min(100%, 460px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 21px;
}

.calculator {
  position: relative;
  width: 100%;
  padding: 23px;
  border: 1px solid rgba(255, 255, 255, 0.095);
  border-radius: 34px;
  background:
    radial-gradient(125% 90% at 50% -10%, rgba(255, 255, 255, 0.075), transparent 56%),
    linear-gradient(155deg, rgba(25, 36, 31, 0.96) 0%, rgba(13, 20, 17, 0.975) 56%, rgba(9, 14, 12, 0.985) 100%);
  box-shadow:
    0 52px 105px -32px rgba(0, 0, 0, 0.86),
    0 22px 44px -24px rgba(0, 0, 0, 0.64),
    inset 0 1px 0 rgba(255, 255, 255, 0.075);
  backdrop-filter: blur(24px) saturate(112%);
  animation: card-in 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.calculator::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 18%;
  right: 18%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(199, 243, 107, 0.55), transparent);
  opacity: 0.7;
  pointer-events: none;
}

.calculator::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.018);
  pointer-events: none;
}

.calculator__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.brand {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 12px;
}

.brand__logo {
  flex: 0 0 auto;
  width: 47px;
  height: 47px;
  padding: 0 0 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  color: #0a1208;
  background: linear-gradient(145deg, #deff92 0%, #c2ef66 58%, #a6d94c 100%);
  box-shadow:
    0 10px 24px rgba(166, 217, 76, 0.17),
    inset 0 1px 0 rgba(255, 255, 255, 0.58);
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1;
  user-select: none;
}

.brand__copy {
  min-width: 0;
}

.brand__eyebrow {
  margin: 0 0 4px;
  color: var(--muted-dim);
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  line-height: 1;
  white-space: nowrap;
}

.brand__title {
  margin: 0;
  color: var(--text);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.15;
  white-space: nowrap;
}

.status {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.028);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.035em;
  line-height: 1;
  white-space: nowrap;
  transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
}

.status__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted);
}

.status[data-state="online"] {
  color: var(--warm);
  border-color: rgba(255, 179, 124, 0.17);
  background: rgba(255, 179, 124, 0.055);
}

.status[data-state="checking"] .status__dot {
  background: var(--warm);
  animation: dot-blink 1.1s ease-in-out infinite;
}

.status[data-state="online"] {
  color: #cfe9bb;
  border-color: rgba(199, 243, 107, 0.15);
  background: rgba(199, 243, 107, 0.055);
}

.status[data-state="online"] .status__dot {
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(199, 243, 107, 0.07);
}

.status[data-state="offline"] {
  color: #ffc0b3;
  border-color: rgba(255, 143, 122, 0.2);
  background: rgba(255, 143, 122, 0.06);
}

.status[data-state="offline"] .status__dot {
  background: var(--danger);
}

.screen {
  position: relative;
  min-height: 164px;
  margin: 20px 0 16px;
  padding: 16px 17px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.062);
  border-radius: 24px;
  background:
    radial-gradient(130% 130% at 102% 0%, rgba(199, 243, 107, 0.075), transparent 44%),
    linear-gradient(180deg, rgba(3, 8, 6, 0.985), rgba(7, 13, 10, 0.94));
  box-shadow:
    inset 0 1px 18px rgba(0, 0, 0, 0.48),
    0 12px 30px rgba(0, 0, 0, 0.17);
  transition: border-color 180ms ease, box-shadow 180ms ease;
}

.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(112deg, transparent 22%, rgba(255, 255, 255, 0.022) 49%, transparent 74%);
  transform: translateX(-110%);
  animation: screen-sheen 9s ease-in-out infinite;
}

.screen::after {
  content: "";
  position: absolute;
  right: -16%;
  bottom: -60%;
  width: 230px;
  height: 180px;
  border-radius: 50%;
  background: rgba(199, 243, 107, 0.045);
  filter: blur(44px);
  pointer-events: none;
}

.screen.is-error {
  border-color: rgba(255, 143, 122, 0.42);
  box-shadow:
    inset 0 1px 18px rgba(0, 0, 0, 0.48),
    0 0 0 1px rgba(255, 143, 122, 0.04),
    0 16px 34px rgba(0, 0, 0, 0.18);
}

.screen.is-shaking {
  animation: shake 320ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
}

.screen__topline {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 16px;
}

.screen__history {
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.012em;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.screen__badge {
  flex: 0 0 auto;
  padding: 3px 7px;
  border: 1px solid rgba(255, 255, 255, 0.065);
  border-radius: 999px;
  color: var(--muted-dim);
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.11em;
  line-height: 1;
}

.screen__display {
  position: relative;
  z-index: 1;
  margin-top: auto;
  padding: 3px 0 1px;
  overflow-x: auto;
  overflow-y: hidden;
  color: #f8fcf8;
  font-family: var(--font-display);
  font-size: clamp(2.85rem, 11.6vw, 3.7rem);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.08;
  text-align: right;
  text-shadow: 0 0 32px rgba(199, 243, 107, 0.055);
  white-space: nowrap;
  scrollbar-width: none;
  transition: font-size 160ms ease;
}

.screen__display::-webkit-scrollbar {
  display: none;
}

.screen__display.is-long {
  font-size: clamp(2.15rem, 8.5vw, 2.8rem);
  letter-spacing: -0.035em;
}

.screen__display.is-very-long {
  font-size: clamp(1.55rem, 6.2vw, 2.05rem);
  letter-spacing: -0.025em;
}

.screen__bottomline {
  position: relative;
  z-index: 1;
  min-height: 16px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
}

.screen__hint {
  color: var(--muted-dim);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.015em;
  line-height: 1.45;
  overflow-wrap: anywhere;
  transition: color 160ms ease;
}

.screen__hint.is-error {
  color: var(--danger);
  font-weight: 600;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.key {
  position: relative;
  height: 60px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 18px;
  color: var(--text);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.073), rgba(255, 255, 255, 0.031));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.045),
    0 6px 12px rgba(0, 0, 0, 0.075);
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 500;
  line-height: 1;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1),
    background 160ms ease,
    border-color 160ms ease,
    box-shadow 160ms ease,
    filter 120ms ease;
}

.key:hover {
  border-color: var(--line-strong);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.105), rgba(255, 255, 255, 0.046));
}

.key:active {
  transform: translateY(1px) scale(0.977);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.18);
}

.key:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.key.is-keyboard {
  filter: brightness(1.32);
  transform: translateY(1px) scale(0.97);
}

.key--utility {
  color: #aebdb5;
  background: rgba(255, 255, 255, 0.034);
  font-family: var(--font-ui);
  font-size: 17px;
  font-weight: 600;
}

.key--utility:hover {
  background: rgba(255, 255, 255, 0.065);
}

.key--clear {
  color: var(--warm);
}

.key--sign {
  color: var(--text-soft);
  font-size: 20px;
}

.key--number {
  font-size: 23px;
  font-weight: 500;
}

.key--operator {
  color: var(--accent);
  border-color: rgba(199, 243, 107, 0.115);
  background:
    linear-gradient(180deg, rgba(199, 243, 107, 0.105), rgba(199, 243, 107, 0.035));
  font-size: 24px;
  font-weight: 500;
}

.key--operator:hover {
  border-color: rgba(199, 243, 107, 0.24);
  background:
    linear-gradient(180deg, rgba(199, 243, 107, 0.16), rgba(199, 243, 107, 0.055));
}

.key--operator:active {
  background: rgba(199, 243, 107, 0.18);
}

.key__icon {
  width: 24px;
  height: 24px;
  margin: 0 auto;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.key--equals {
  grid-column: 1 / -1;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 0;
  color: #10170a;
  background: linear-gradient(135deg, #d9ff8b 0%, #c2ef66 52%, #a9dc4f 100%);
  box-shadow:
    0 13px 28px rgba(168, 218, 78, 0.19),
    0 5px 12px rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255, 255, 255, 0.52);
}

.key--equals:hover {
  background: linear-gradient(135deg, #e2ffa0 0%, #c9f472 52%, #b0e456 100%);
  filter: brightness(1.015);
  transform: translateY(-1px);
}

.key--equals:active {
  transform: translateY(1px) scale(0.988);
  box-shadow:
    0 7px 16px rgba(168, 218, 78, 0.15),
    inset 0 2px 5px rgba(60, 82, 20, 0.18);
}

.key--equals__sign {
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1;
}

.key--equals__hint {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  line-height: 1;
  opacity: 0.52;
}

.calculator__footer {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  color: var(--muted-dim);
  font-size: 10px;
  font-weight: 500;
  line-height: 1;
}

.shortcut {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

kbd {
  min-width: 21px;
  padding: 4px 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.075);
  border-bottom-color: rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  color: #a8b8af;
  background: rgba(255, 255, 255, 0.04);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
  font-family: var(--font-mono);
  font-size: 8.5px;
  line-height: 1;
}

.page__note {
  margin: 0;
  padding: 0 6px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: rgba(195, 210, 201, 0.52);
  font-size: 10.5px;
  font-weight: 450;
  letter-spacing: 0.015em;
  line-height: 1.6;
  text-align: center;
  animation: fade-up 800ms 120ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.page__note strong {
  color: rgba(199, 243, 107, 0.78);
  font-weight: 650;
}

.page__url {
  color: rgba(195, 210, 201, 0.62);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: -0.01em;
}

.page__pulse {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(199, 243, 107, 0.72);
  box-shadow: 0 0 0 4px rgba(199, 243, 107, 0.045);
}

.page__divider {
  color: rgba(195, 210, 201, 0.22);
}

.noscript {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  padding: 10px 15px;
  border: 1px solid rgba(255, 143, 122, 0.28);
  border-radius: 10px;
  color: #ffd0c6;
  background: #251310;
  font-family: var(--font-ui);
  font-size: 12px;
  white-space: nowrap;
}

@keyframes card-in {
  from {
    transform: translateY(18px) scale(0.99);
  }
  to {
    transform: translateY(0) scale(1);
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes drift-lime {
  from {
    transform: translate3d(-18px, -12px, 0) scale(0.97);
  }
  to {
    transform: translate3d(38px, 34px, 0) scale(1.06);
  }
}

@keyframes drift-amber {
  from {
    transform: translate3d(15px, 18px, 0) scale(1.02);
  }
  to {
    transform: translate3d(-34px, -26px, 0) scale(0.95);
  }
}

@keyframes dot-blink {
  0%,
  100% {
    opacity: 0.42;
  }
  50% {
    opacity: 1;
  }
}

@keyframes screen-sheen {
  0%,
  45% {
    transform: translateX(-110%);
    opacity: 0;
  }
  52% {
    opacity: 0.9;
  }
  70%,
  100% {
    transform: translateX(110%);
    opacity: 0;
  }
}

@keyframes shake {
  10%,
  90% {
    transform: translateX(-1px);
  }
  20%,
  80% {
    transform: translateX(2px);
  }
  30%,
  50%,
  70% {
    transform: translateX(-3px);
  }
  40%,
  60% {
    transform: translateX(3px);
  }
}

@media (max-width: 480px) {
  body {
    padding: 24px 13px 20px;
  }

  .page {
    gap: 17px;
  }

  .calculator {
    padding: 18px;
    border-radius: 29px;
  }

  .brand {
    gap: 10px;
  }

  .brand__logo {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    font-size: 20px;
  }

  .brand__title {
    font-size: 18px;
  }

  .brand__eyebrow {
    font-size: 7.8px;
  }

  .status {
    padding: 6px 8px;
    font-size: 9.5px;
  }

  .screen {
    min-height: 151px;
    margin: 16px 0 14px;
    padding: 14px 15px 12px;
    border-radius: 21px;
  }

  .screen__display {
    font-size: clamp(2.7rem, 12.4vw, 3.35rem);
  }

  .screen__display.is-long {
    font-size: clamp(2rem, 9vw, 2.55rem);
  }

  .screen__display.is-very-long {
    font-size: clamp(1.4rem, 6.5vw, 1.85rem);
  }

  .keypad {
    gap: 8px;
  }

  .key {
    height: 55px;
    border-radius: 16px;
    font-size: 20px;
  }

  .key--number {
    font-size: 22px;
  }

  .key--operator {
    font-size: 22px;
  }

  .page__note {

  }
}

@media (max-width: 360px) {
  body {

  .calculator {

}

@media (max-height: 730px) {

@media (hover: none) {

}

@media (prefers-reduced-motion: reduce) {

  *::before,

</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient__glow ambient__glow--lime"></span>
    <span class="ambient__glow ambient__glow--amber"></span>
    <span class="ambient__grid"></span>
  </div>

  <main class="page">
    <section class="calculator" aria-labelledby="app-title">
      <header class="calculator__header">
        <div class="brand">
          <div class="brand__logo" aria-hidden="true">JS</div>
          <div class="brand__copy">
            <p class="brand__eyebrow">STANDALONE / JS</p>
            <h1 class="brand__title" id="app-title">简易计算器</h1>
          </div>
        </div>

        <div class="status" id="serviceStatus" data-state="checking" aria-label="计算器状态">
          <span class="status__dot" aria-hidden="true"></span>
          <span class="status__text" id="statusText">本机运算</span>
        </div>
      </header>

      <div class="screen" id="screen">
        <div class="screen__topline">
          <span class="screen__history" id="history" title="上一次计算">准备就绪</span>
          <span class="screen__badge">JS</span>
        </div>

        <div class="screen__display" id="display" aria-live="polite">0</div>

        <div class="screen__bottomline">
          <span class="screen__hint" id="hint" aria-live="polite">支持 + − × ÷ 与括号</span>
        </div>
      </div>

      <div class="keypad" id="keypad" role="group" aria-label="计算器按键">
        <button type="button" class="key key--utility key--clear" data-action="clear" aria-label="全部清除">AC</button>
        <button type="button" class="key key--utility" data-action="paren" data-value="(" aria-label="左括号">(</button>
        <button type="button" class="key key--utility" data-action="paren" data-value=")" aria-label="右括号">)</button>
        <button type="button" class="key key--utility" data-action="backspace" aria-label="退格">
          <svg class="key__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6H9.5L3.8 12l5.7 6H20a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Z"></path>
            <path d="m12 9.5 5 5m0-5-5 5"></path>
          </svg>
        </button>

        <button type="button" class="key key--number" data-action="digit" data-value="7">7</button>
        <button type="button" class="key key--number" data-action="digit" data-value="8">8</button>
        <button type="button" class="key key--number" data-action="digit" data-value="9">9</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="/" aria-label="除">÷</button>

        <button type="button" class="key key--number" data-action="digit" data-value="4">4</button>
        <button type="button" class="key key--number" data-action="digit" data-value="5">5</button>
        <button type="button" class="key key--number" data-action="digit" data-value="6">6</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="*" aria-label="乘">×</button>

        <button type="button" class="key key--number" data-action="digit" data-value="1">1</button>
        <button type="button" class="key key--number" data-action="digit" data-value="2">2</button>
        <button type="button" class="key key--number" data-action="digit" data-value="3">3</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="-" aria-label="减">−</button>

        <button type="button" class="key key--utility key--sign" data-action="sign" aria-label="切换正负号">±</button>
        <button type="button" class="key key--number" data-action="digit" data-value="0">0</button>
        <button type="button" class="key key--number" data-action="decimal" aria-label="小数点">.</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="+" aria-label="加">+</button>

        <button type="button" class="key key--equals" data-action="equals" aria-label="计算结果">
          <span class="key--equals__sign">=</span>
          <span class="key--equals__hint">计算</span>
        </button>
      </div>

      <footer class="calculator__footer" aria-label="键盘快捷键">
        <span class="shortcut"><kbd>Enter</kbd><span>计算</span></span>
        <span class="shortcut"><kbd>Esc</kbd><span>清空</span></span>
        <span class="shortcut"><kbd>⌫</kbd><span>退格</span></span>
      </footer>
    </section>

    <p class="page__note">
      <span class="page__pulse" aria-hidden="true"></span>
      <strong>单文件网页</strong> · 无需服务器
      <span class="page__divider" aria-hidden="true">/</span>
      <span class="page__url" id="pageUrl">离线可用</span>
    </p>
  </main>

  <noscript>
    <div class="noscript">请启用 JavaScript 后使用这个计算器。</div>
  </noscript>

  <script>
(() => {
  "use strict";

  const DEFAULT_HINT = "支持 + − × ÷ 与括号";
  const RESULT_HINT = "按任意数字开始新的计算";
  const MAX_EXPRESSION_LENGTH = 200;

  const state = {
    expression: "0",
    justEvaluated: false,
    history: "准备就绪",
  };

  const elements = {
    screen: document.getElementById("screen"),
    display: document.getElementById("display"),
    history: document.getElementById("history"),
    hint: document.getElementById("hint"),
    keypad: document.getElementById("keypad"),
    serviceStatus: document.getElementById("serviceStatus"),
    statusText: document.getElementById("statusText"),
    pageUrl: document.getElementById("pageUrl"),
  };

  if (!elements.keypad || !elements.display) {
    return;
  }

  class CalcError extends Error {}

  function normalizeExpression(expression) {
    return String(expression)
      .replace(/×/g, "*")
      .replace(/÷/g, "/")
      .replace(/−/g, "-")
      .replace(/（/g, "(")
      .replace(/）/g, ")");
  }

  function calculateValue(expression) {
    const text = normalizeExpression(expression);
    if (text.length > MAX_EXPRESSION_LENGTH) {
      throw new CalcError("算式太长，请控制在 200 个字符以内");
    }

    let position = 0;

    function skipSpace() {
      while (position < text.length && /\s/.test(text[position])) {
        position += 1;
      }
    }

    function parseNumber() {
      const start = position;
      let hasDigits = false;

      while (position < text.length && /[0-9]/.test(text[position])) {
        hasDigits = true;
        position += 1;
      }

      if (text[position] === ".") {
        position += 1;
        while (position < text.length && /[0-9]/.test(text[position])) {
          hasDigits = true;
          position += 1;
        }
      }

      if (!hasDigits) {
        throw new CalcError("数字格式有误");
      }

      if (text[position] === "e" || text[position] === "E") {
        const exponentStart = position;
        position += 1;
        if (text[position] === "+" || text[position] === "-") {
          position += 1;
        }
        const digitStart = position;
        while (position < text.length && /[0-9]/.test(text[position])) {
          position += 1;
        }
        if (position === digitStart) {
          position = exponentStart;
          throw new CalcError("数字格式有误");
        }
      }

      const token = text.slice(start, position);
      const value = Number(token);
      if (!Number.isFinite(value)) {
        throw new CalcError("数字超出可计算范围");
      }
      return value;
    }

    function parsePrimary() {
      skipSpace();
      if (position >= text.length) {
        throw new CalcError("算式不完整");
      }

      if (text[position] === "(") {
        position += 1;
        const value = parseExpression();
        skipSpace();
        if (position >= text.length || text[position] !== ")") {
          throw new CalcError("括号不匹配");
        }
        position += 1;
        return value;
      }

      if (text[position] === ")") {
        throw new CalcError("括号不匹配");
      }

      if (/[0-9.]/.test(text[position])) {
        return parseNumber();
      }

      throw new CalcError("算式中包含无法识别的字符");
    }

    function parseUnary() {
      skipSpace();
      if (position >= text.length) {
        throw new CalcError("算式不完整");
      }
      if (text[position] === "+") {
        position += 1;
        return parseUnary();
      }
      if (text[position] === "-") {
        position += 1;
        return -parseUnary();
      }
      return parsePrimary();
    }

    function parseTerm() {
      let value = parseUnary();
      while (true) {
        skipSpace();
        if (position >= text.length) {
          break;
        }
        if (text[position] === "*") {
          position += 1;
          value *= parseUnary();
          if (!Number.isFinite(value)) {
            throw new CalcError("结果超出可计算范围");
          }
        } else if (text[position] === "/") {
          position += 1;
          const divisor = parseUnary();
          if (divisor === 0) {
            throw new CalcError("不能除以 0");
          }
          value /= divisor;
          if (!Number.isFinite(value)) {
            throw new CalcError("结果超出可计算范围");
          }
        } else {
          break;
        }
      }
      return value;
    }

    function parseExpression() {
      let value = parseTerm();
      while (true) {
        skipSpace();
        if (position >= text.length) {
          break;
        }
        if (text[position] === "+") {
          position += 1;
          value += parseTerm();
          if (!Number.isFinite(value)) {
            throw new CalcError("结果超出可计算范围");
          }
        } else if (text[position] === "-") {
          position += 1;
          value -= parseTerm();
          if (!Number.isFinite(value)) {
            throw new CalcError("结果超出可计算范围");
          }
        } else {
          break;
        }
      }
      return value;
    }

    skipSpace();
    if (position >= text.length) {
      throw new CalcError("请输入算式");
    }

    const result = parseExpression();
    skipSpace();
    if (position !== text.length) {
      if (text[position] === ")") {
        throw new CalcError("括号不匹配");
      }
      throw new CalcError("算式中包含无法识别的字符");
    }
    if (!Number.isFinite(result)) {
      throw new CalcError("结果超出可计算范围");
    }
    return result;
  }

  function formatNumber(value) {
    if (!Number.isFinite(value)) {
      throw new CalcError("结果超出可计算范围");
    }
    if (value === 0 || Object.is(value, -0)) {
      return "0";
    }

    const absoluteValue = Math.abs(value);
    if (absoluteValue >= 1e12 || absoluteValue < 1e-9) {
      let scientific = value.toExponential(11);
      const [rawMantissa, rawExponent] = scientific.split("e");
      let mantissa = rawMantissa;
      if (mantissa.includes(".")) {
        mantissa = mantissa.replace(/0+$/, "").replace(/\.$/, "");
      }
      const exponent = Number(rawExponent);
      return mantissa + "e" + (exponent >= 0 ? "+" : "") + exponent;
    }

    let fixed = value.toFixed(12);
    if (fixed.includes(".")) {
      fixed = fixed.replace(/0+$/, "").replace(/\.$/, "");
    }
    return fixed === "-0" || fixed === "" ? "0" : fixed;
  }

  function calculate(expression) {
    return formatNumber(calculateValue(expression));
  }

  function prettyExpression(expression) {
    return String(expression)
      .replace(/\*/g, "×")
      .replace(/\//g, "÷")
      .replace(/-/g, "−");
  }

  function groupInteger(integer) {
    return integer.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function formatResult(rawValue) {
    let value = String(rawValue);
    let sign = "";

    if (value.startsWith("-")) {
      sign = "-";
      value = value.slice(1);
    }

    const exponentIndex = value.search(/[eE]/);
    let exponent = "";
    if (exponentIndex !== -1) {
      exponent = value.slice(exponentIndex);
      value = value.slice(0, exponentIndex);
    }

    const dotIndex = value.indexOf(".");
    let integer = dotIndex === -1 ? value : value.slice(0, dotIndex);
    const fraction = dotIndex === -1 ? "" : value.slice(dotIndex);

    if (integer === "") {
      integer = "0";
    }

    return sign + groupInteger(integer) + fraction + exponent;
  }

  function render() {
    const visible = state.justEvaluated
      ? formatResult(state.expression)
      : prettyExpression(state.expression || "0");

    elements.display.textContent = visible;
    elements.display.classList.toggle("is-long", visible.length > 12 && visible.length <= 19);
    elements.display.classList.toggle("is-very-long", visible.length > 19);

    elements.history.textContent = state.history;
    elements.history.title = state.history;

    window.requestAnimationFrame(() => {
      elements.display.scrollLeft = elements.display.scrollWidth;
    });
  }

  function setHint(message, isError = false) {
    elements.hint.textContent = message;
    elements.hint.classList.toggle("is-error", isError);
    if (!isError) {
      elements.screen.classList.remove("is-error");
    }
  }

  function clearFeedback() {
    elements.screen.classList.remove("is-error", "is-shaking");
    elements.hint.classList.remove("is-error");
    setHint(state.justEvaluated ? RESULT_HINT : DEFAULT_HINT);
  }

  let shakeTimer = 0;

  function showError(message) {
    setHint(message, true);
    elements.screen.classList.add("is-error");
    elements.screen.classList.remove("is-shaking");
    void elements.screen.offsetWidth;
    elements.screen.classList.add("is-shaking");

    window.clearTimeout(shakeTimer);
    shakeTimer = window.setTimeout(() => {
      elements.screen.classList.remove("is-shaking");
    }, 360);
  }

  function appendDigit(digit) {
    if (state.justEvaluated) {
      state.justEvaluated = false;
      state.expression = "0";
    }

    if (state.expression.endsWith(")")) {
      state.expression += "*";
    }

    if (!state.expression || state.expression === "0") {
      state.expression = digit;
    } else if (/(^|[+\-*/(])0$/.test(state.expression)) {
      state.expression = state.expression.slice(0, -1) + digit;
    } else {
      state.expression += digit;
    }

    clearFeedback();
    render();
  }

  function appendDecimal() {
    if (state.justEvaluated) {
      state.justEvaluated = false;
      state.expression = "0";
    }

    if (state.expression.endsWith(")")) {
      state.expression += "*";
    }

    if (!state.expression || /[+\-*/(]$/.test(state.expression)) {
      state.expression += "0.";
    } else {
      const tail = state.expression.match(/(\d+(?:\.\d*)?|\.\d+)$/);
      if (tail && tail[0].includes(".")) {
        return;
      }
      state.expression += ".";
    }

    clearFeedback();
    render();
  }

  function appendOperator(operator) {
    if (state.justEvaluated) {
      state.justEvaluated = false;
    }

    if (!state.expression) {
      state.expression = "0";
    }

    if (state.expression === "-" && operator !== "-") {
      return;
    }

    const last = state.expression.slice(-1);
    if (last === "(") {
      if (operator === "-") {
        state.expression += "-";
      }
    } else if (/[+\-*/]/.test(last)) {
      state.expression = state.expression.slice(0, -1) + operator;
    } else if (last === ".") {
      state.expression += "0" + operator;
    } else {
      state.expression += operator;
    }

    clearFeedback();
    render();
  }

  function appendParen(paren) {
    if (paren === "(") {
      if (state.justEvaluated) {
        state.expression = "";
        state.justEvaluated = false;
      }

      if (!state.expression || state.expression === "0") {
        state.expression = "(";
      } else {
        if (state.expression.endsWith(".")) {
          state.expression += "0";
        }
        const last = state.expression.slice(-1);
        if (last === ")" || /\d/.test(last)) {
          state.expression += "*";
        }
        state.expression += "(";
      }

      clearFeedback();
      render();
      return;
    }

    if (state.justEvaluated) {
      return;
    }

    const openCount = (state.expression.match(/\(/g) || []).length;
    const closeCount = (state.expression.match(/\)/g) || []).length;
    if (openCount <= closeCount) {
      return;
    }

    const last = state.expression.slice(-1);
    if (last === "(" || /[+\-*/]$/.test(last)) {
      return;
    }
    if (last === ".") {
      state.expression += "0";
    }

    state.expression += ")";
    clearFeedback();
    render();
  }

  function toggleSign() {
    if (state.justEvaluated) {
      state.expression = state.expression.startsWith("-")
        ? state.expression.slice(1)
        : "-" + state.expression;
      render();
      return;
    }

    if (!state.expression || state.expression === "0") {
      state.expression = "-";
      clearFeedback();
      render();
      return;
    }

    if (state.expression === "-") {
      state.expression = "0";
      clearFeedback();
      render();
      return;
    }

    const trailingNumber = state.expression.match(/(\d+(?:\.\d*)?|\.\d+)$/);
    if (!trailingNumber) {
      return;
    }

    const start = state.expression.length - trailingNumber[0].length;
    if (start > 0 && state.expression[start - 1] === "-") {
      const beforeMinus = start >= 2 ? state.expression[start - 2] : "";
      if (start === 1 || /[+\-*/(]/.test(beforeMinus)) {
        state.expression =
          state.expression.slice(0, start - 1) + state.expression.slice(start);
        clearFeedback();
        render();
        return;
      }
    }

    state.expression =
      state.expression.slice(0, start) + "-" + state.expression.slice(start);
    clearFeedback();
    render();
  }

  function backspace() {
    if (state.justEvaluated) {
      state.justEvaluated = false;
    }

    if (state.expression.length <= 1) {
      state.expression = "0";
    } else {
      state.expression = state.expression.slice(0, -1);
      if (!state.expression || state.expression === "-") {
        state.expression = "0";
      }
    }

    clearFeedback();
    render();
  }

  function clearAll() {
    state.expression = "0";
    state.justEvaluated = false;
    state.history = "准备就绪";
    elements.screen.classList.remove("is-error", "is-shaking");
    elements.hint.classList.remove("is-error");
    elements.hint.textContent = DEFAULT_HINT;
    render();
  }

  function calculateCurrent() {
    if (!state.expression || state.expression === "-") {
      showError("请输入完整的算式");
      return;
    }

    const original = state.expression;
    try {
      const result = calculate(original);
      state.expression = result;
      state.justEvaluated = true;
      state.history = prettyExpression(original) + " =";
      setHint(RESULT_HINT);
      elements.screen.classList.remove("is-error");
      render();
    } catch (error) {
      showError(error instanceof CalcError ? error.message : "计算失败，请检查算式");
    }
  }

  function pulseKey(action, value) {
    let selector = `.key[data-action="${action}"]`;
    if (value !== undefined) {
      selector += `[data-value="${value}"]`;
    }
    const key = elements.keypad.querySelector(selector);
    if (!key) {
      return;
    }
    key.classList.add("is-keyboard");
    window.setTimeout(() => key.classList.remove("is-keyboard"), 120);
  }

  function dispatchAction(action, value) {
    switch (action) {
      case "digit":
        appendDigit(value);
        break;
      case "decimal":
        appendDecimal();
        break;
      case "operator":
        appendOperator(value);
        break;
      case "paren":
        appendParen(value);
        break;
      case "sign":
        toggleSign();
        break;
      case "backspace":
        backspace();
        break;
      case "clear":
        clearAll();
        break;
      case "equals":
        calculateCurrent();
        break;
      default:
        break;
    }
  }

  elements.keypad.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-action]");
    if (!button) {
      return;
    }
    if (event.detail > 0) {
      button.blur();
    }
    dispatchAction(button.dataset.action, button.dataset.value);
  });

  document.addEventListener("keydown", (event) => {
    if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) {
      return;
    }

    const activeElement = document.activeElement;
    if (
      activeElement &&
      activeElement.tagName === "BUTTON" &&
      (event.key === "Enter" || event.key === " ")
    ) {
      return;
    }

    if (
      activeElement &&
      (activeElement.tagName === "INPUT" ||
        activeElement.tagName === "TEXTAREA" ||
        activeElement.tagName === "SELECT")
    ) {
      return;
    }

    const key = event.key;
    let handled = true;

    if (/^[0-9]$/.test(key)) {
      appendDigit(key);
      pulseKey("digit", key);
    } else if (key === "." || key === ",") {
      appendDecimal();
      pulseKey("decimal");
    } else if (key === "+" || key === "-" || key === "*" || key === "/") {
      appendOperator(key);
      pulseKey("operator", key);
    } else if (key === "x" || key === "X") {
      appendOperator("*");
      pulseKey("operator", "*");
    } else if (key === "(" || key === ")") {
      appendParen(key);
      pulseKey("paren", key);
    } else if (key === "Enter" || key === "=") {
      calculateCurrent();
      pulseKey("equals");
    } else if (key === "Backspace") {
      backspace();
      pulseKey("backspace");
    } else if (key === "Delete" || key === "Escape" || key === "c" || key === "C") {
      clearAll();
      pulseKey("clear");
    } else {
      handled = false;
    }

    if (handled) {
      event.preventDefault();
    }
  });

  elements.statusText.textContent = "本机运算";
  elements.pageUrl.textContent =
    window.location.protocol === "file:"
      ? "离线可用"
      : window.location.host || "单文件网页";

  render();
})();

</script>
</body>
</html>
