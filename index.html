<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19070b">
  <title>指尖花 · Fingertip Bloom</title>
  <style>
    :root {
      --bg: #19070b;
      --ink: #f7edf0;
      --muted: #b98f9b;
      --dim: #73505b;
      --pink: #ff6fae;
      --pink-soft: #ff9ac6;
      --violet: #a763ff;
      --line: rgba(255, 170, 200, 0.16);
      --panel: rgba(20, 6, 10, 0.66);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(1100px 760px at 50% 44%, rgba(82, 15, 35, 0.48), transparent 64%),
        radial-gradient(800px 600px at 14% 100%, rgba(85, 17, 28, 0.2), transparent 70%),
        #19070b;
    }

    button, input { font: inherit; }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default;
    }

    body.mouse-mode #scene { cursor: ew-resize; }

    .ui {
      position: fixed;
      z-index: 5;
      pointer-events: none;
    }

    .brand {
      top: clamp(20px, 4vw, 42px);
      left: clamp(20px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.45);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 31px);
      font-weight: 600;
      letter-spacing: 0.14em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    .badge {
      top: clamp(22px, 4vw, 42px);
      right: clamp(20px, 4vw, 48px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(18, 5, 9, 0.42);
      backdrop-filter: blur(16px);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.2em;
    }

    .badge::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--dim);
      box-shadow: 0 0 10px transparent;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .badge.live { color: #ffd7e4; }
    .badge.live::before {
      background: var(--pink);
      box-shadow: 0 0 12px rgba(255, 111, 174, 0.85);
    }

    .footer {
      left: 50%;
      bottom: clamp(18px, 3.3vw, 34px);
      transform: translateX(-50%);
      width: min(92vw, 720px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #dfbcc7;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
    }

    .status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 111, 174, 0.7);
      box-shadow: 0 0 10px rgba(255, 111, 174, 0.45);
    }

    .status.muted { color: var(--muted); }

    .debug {
      left: clamp(16px, 3vw, 38px);
      bottom: clamp(16px, 3vw, 34px);
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      pointer-events: auto;
    }

    .debug label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.16em;
      white-space: nowrap;
    }

    .debug output {
      min-width: 34px;
      color: #ffd3e2;
      font: 11px/1 "Cascadia Mono", "Consolas", monospace;
      text-align: right;
    }

    #bloomSlider {
      -webkit-appearance: none;
      appearance: none;
      width: clamp(78px, 10vw, 130px);
      height: 3px;
      border-radius: 999px;
      outline: none;
      background: linear-gradient(90deg, #7e2a51, #ff79b4);
      cursor: pointer;
    }

    #bloomSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border: 2px solid #ffd4e3;
      border-radius: 50%;
      background: #ff6fae;
      box-shadow: 0 0 12px rgba(255, 111, 174, 0.65);
    }

    #bloomSlider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 2px solid #ffd4e3;
      border-radius: 50%;
      background: #ff6fae;
      box-shadow: 0 0 12px rgba(255, 111, 174, 0.65);
    }

    .camera-panel {
      right: clamp(16px, 3vw, 38px);
      bottom: clamp(16px, 3vw, 38px);
      width: clamp(150px, 15vw, 226px);
      padding: 8px;
      border: 1px solid rgba(255, 174, 204, 0.22);
      border-radius: 17px;
      background: rgba(15, 4, 8, 0.82);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      pointer-events: none;
    }

    .camera-panel.is-hidden { display: none; }

    .camera-cap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1px 3px 7px;
      color: #d9aebb;
      font-size: 8px;
      letter-spacing: 0.2em;
    }

    .camera-cap span:last-child { color: #8b626d; }

    .camera-body {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 11px;
      background: #170a11;
    }

    #cameraVideo,
    #handCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #cameraVideo {
      object-fit: cover;
      transform: scaleX(-1);
      filter: saturate(1.12) contrast(1.04) brightness(0.9);
    }

    #handCanvas { pointer-events: none; }

    .welcome {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 620px at 50% 50%, rgba(68, 12, 30, 0.55), transparent 68%),
        rgba(12, 3, 6, 0.68);
      backdrop-filter: blur(12px);
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .welcome.is-gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card {
      width: min(92vw, 390px);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 18px;
      color: #a87584;
      font-size: 9px;
      letter-spacing: 0.34em;
    }

    .welcome h2 {
      margin: 0;
      font-size: clamp(35px, 6vw, 58px);
      font-weight: 500;
      letter-spacing: 0.16em;
    }

    .welcome .en {
      margin: 8px 0 20px;
      color: #b88395;
      font-size: 9px;
      letter-spacing: 0.42em;
    }

    .welcome .copy {
      margin: 0 auto 26px;
      max-width: 300px;
      color: #bb959f;
      font-size: 12px;
      line-height: 1.8;
    }

    .start-btn {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid rgba(255, 168, 199, 0.48);
      border-radius: 999px;
      background: linear-gradient(135deg, #ff7ab6, #b965ff);
      color: #220612;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(198, 74, 139, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 48px rgba(198, 74, 139, 0.35);
    }

    .start-btn:disabled { opacity: 0.55; cursor: wait; }

    .skip-btn {
      margin-top: 14px;
      padding: 8px 12px;
      border: 0;
      background: none;
      color: #8f6975;
      font-size: 10px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .skip-btn:hover { color: #e8cbd4; }

    .welcome-note {
      min-height: 16px;
      margin: 14px 0 0;
      color: #b46f82;
      font-size: 10px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .debug {
        left: 14px;
        bottom: 14px;
        padding: 8px 10px;
      }

      .camera-panel {
        width: 138px;
        right: 14px;
        bottom: 14px;
      }

      .footer {
        bottom: 58px;
        width: 72vw;
      }

      .badge {
        top: 18px;
        right: 18px;
        padding: 7px 10px;
        font-size: 8px;
      }

      .brand { top: 18px; left: 18px; }
      .brand h1 { font-size: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .welcome, .start-btn { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="粒子花场景"></canvas>

  <header class="ui brand">
    <h1>指尖花</h1>
    <p>Fingertip Bloom</p>
  </header>

  <div class="ui badge" id="modeBadge">待机</div>

  <div class="ui debug">
    <label for="bloomSlider">BLOOM</label>
    <input id="bloomSlider" type="range" min="0" max="1" step="0.001" value="0.04" aria-label="绽放进度">
    <output id="bloomOutput">4%</output>
  </div>

  <div class="ui camera-panel is-hidden" id="cameraPanel">
    <div class="camera-cap">
      <span>HAND TRACKING</span>
      <span id="trackState">WAIT</span>
    </div>
    <div class="camera-body">
      <video id="cameraVideo" muted playsinline autoplay></video>
      <canvas id="handCanvas" width="320" height="240"></canvas>
    </div>
  </div>

  <footer class="ui footer">
    <div class="status muted" id="statusText">点击开启摄像头，或先用鼠标体验</div>
  </footer>

  <div class="welcome" id="welcome">
    <div class="welcome-card">
      <div class="eyebrow">THREE.JS × MEDIAPIPE</div>
      <h2>指尖花</h2>
      <p class="en">FINGERTIP BLOOM</p>
      <p class="copy">张开手掌，让花苞在指尖绽放。<br>移动手掌，花会跟着你轻轻转动。</p>
      <button class="start-btn" id="startBtn">开启摄像头</button>
      <button class="skip-btn" id="skipBtn">先用鼠标体验</button>
      <p class="welcome-note" id="welcomeNote">摄像头只在本机处理，不会上传。</p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // -------------------------------------------------------------------------
    // 基础设置
    // -------------------------------------------------------------------------
    const IS_MOBILE = matchMedia('(max-width: 700px)').matches;
    const CORES = navigator.hardwareConcurrency || 4;
    const MEMORY = navigator.deviceMemory || 8;
    const LOW_END = IS_MOBILE || CORES <= 4 || MEMORY <= 4;
    const PARTICLE_COUNT = LOW_END ? 16000 : 44000;
    const PIXEL_RATIO = Math.min(devicePixelRatio || 1, IS_MOBILE ? 1.5 : 1.75);

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(PIXEL_RATIO);
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.setClearColor(0x19070b, 1);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x19070b);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(0, 0.52, 6.2);
    camera.lookAt(0, 0.08, 0);

    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(PIXEL_RATIO);
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new RenderPass(scene, camera));

    // 柔和 bloom：阈值抬高，强度压低，避免整朵花过曝
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.34,
      0.4,
      0.3
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // -------------------------------------------------------------------------
    // 背景柔光（纯 shader，无图片）
    // -------------------------------------------------------------------------
    const backdropUniforms = {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0x4a0c24) }
    };
    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 12),
      new THREE.ShaderMaterial({
        uniforms: backdropUniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uTime;
          varying vec2 vUv;
          void main() {
            vec2 p = vUv - 0.5;
            float d = length(p * vec2(1.15, 1.0));
            float glow = exp(-d * d * 12.0);
            float breath = 0.9 + 0.1 * sin(uTime * 0.7);
            gl_FragColor = vec4(uColor * glow * breath, glow * 0.34);
          }
        `
      })
    );
    backdrop.position.set(0, 0, -2.4);
    scene.add(backdrop);

    // -------------------------------------------------------------------------
    // 双位置粒子花
    // 每个粒子只生成一次 aPosBud / aPosFull，之后完全由 GPU 插值。
    // -------------------------------------------------------------------------
    const flower = new THREE.Group();
    scene.add(flower);

    const budPositions = new Float32Array(PARTICLE_COUNT * 3);
    const fullPositions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const delays = new Float32Array(PARTICLE_COUNT);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const seeds = new Float32Array(PARTICLE_COUNT);
    const edgeFactors = new Float32Array(PARTICLE_COUNT);
    const outwardFactors = new Float32Array(PARTICLE_COUNT);
    const rimFactors = new Float32Array(PARTICLE_COUNT);
    const layerFactors = new Float32Array(PARTICLE_COUNT);
    const coreFlags = new Float32Array(PARTICLE_COUNT);

    let seed = 8844221;
    const rand = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const gaussian = () => {
      const u1 = Math.max(1e-6, rand());
      const u2 = rand();
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(Math.PI * 2 * u2);
    };

    const centerPalette = [
      0xffc6d8, 0xffd5e2, 0xffb4ce, 0xffe0e8
    ].map((hex) => new THREE.Color(hex).convertSRGBToLinear());
    const edgePalette = [
      0xb34b77, 0xc65c87, 0x9b3d72, 0xbb507c
    ].map((hex) => new THREE.Color(hex).convertSRGBToLinear());
    const corePalette = [
      0xffd39a, 0xffb86e, 0xffe6c2, 0xffc780
    ].map((hex) => new THREE.Color(hex).convertSRGBToLinear());
    const dustPalette = [
      0xd97aa6, 0x9d63c9, 0xe78bab
    ].map((hex) => new THREE.Color(hex).convertSRGBToLinear());

    // 三层花瓣：外层最大最深，内层最小最亮
    const petalLayers = [
      { base: 0.32, length: 1.1, width: 0.46, cup: 0.28, z: -0.24, angle: 0, delay: 0, colorShift: 0.24, radiusScale: 1.0, sizeScale: 0.92 },
      { base: 0.24, length: 0.9, width: 0.4, cup: 0.22, z: 0.0, angle: Math.PI / 6, delay: 0.08, colorShift: 0.11, radiusScale: 0.82, sizeScale: 1.06 },
      { base: 0.17, length: 0.66, width: 0.34, cup: 0.16, z: 0.16, angle: Math.PI / 12, delay: 0.16, colorShift: 0, radiusScale: 0.66, sizeScale: 1.2 }
    ];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const typeRoll = rand();
      const isCore = typeRoll < 0.05;
      const isDust = typeRoll > 0.96;
      const isPetal = !isCore && !isDust;

      let bx = 0;
      let by = 0;
      let bz = 0;
      let fx = 0;
      let fy = 0;
      let fz = 0;
      let delay = 0;
      let size = 0.02;
      let edgeFactor = 0;
      let outwardFactor = 0;
      let rimFactor = 0;
      let layerFactor = 0;
      let coreFlag = 0;
      const color = new THREE.Color();

      if (isPetal) {
        const centerColor = centerPalette[Math.floor(rand() * centerPalette.length)];
        const edgeColor = edgePalette[Math.floor(rand() * edgePalette.length)];
        const petal = Math.floor(rand() * 6);
        const layerRoll = rand();
        const layer = layerRoll < 0.42 ? 0 : layerRoll < 0.76 ? 1 : 2;
        layerFactor = layer;
        const cfg = petalLayers[layer];
        // 三层保持相同六个方向，形成可辨认的重瓣轮廓；只做极轻微错位
        const theta = petal * (Math.PI * 2 / 6) + cfg.angle
          + (rand() - 0.5) * 0.035;

        const profile = rand();
        let u;
        if (profile < 0.32) {
          u = (rand() < 0.5 ? -1 : 1) * (0.9 + rand() * 0.1);
        } else if (profile < 0.62) {
          const vein = Math.floor(rand() * 5) - 2;
          u = vein / 2.5 + (rand() - 0.5) * 0.07;
        } else {
          u = (rand() * 2 - 1) * 0.92;
        }

        // 真实花瓣：基部收窄，中段变宽，瓣尖略圆，表面带一点杯状弧度
        const s = 0.03 + rand() * 0.95;
        const lengthVar = 0.93 + rand() * 0.14;
        const widthProfile = Math.pow(Math.sin(Math.PI * Math.pow(s, 0.72)), 0.56)
          + 0.05 * Math.pow(s, 8);
        const halfWidth = cfg.width * widthProfile * (0.72 + 0.28 * s);
        const radius = cfg.base + cfg.length * lengthVar * s;
        const cup = cfg.cup * Math.sin(Math.PI * s) * (1 - u * u);
        const dirX = Math.cos(theta);
        const dirY = Math.sin(theta);
        const tanX = -Math.sin(theta);
        const tanY = Math.cos(theta);
        fx = dirX * radius + tanX * u * halfWidth;
        fy = dirY * radius + tanY * u * halfWidth;
        fz = cfg.z + cup + (rand() - 0.5) * 0.022;

        edgeFactor = Math.abs(u);
        // 瓣缘有细光边，但不是放射状硬线
        if (edgeFactor > 0.88) {
          rimFactor = 1;
        }

        const outward = THREE.MathUtils.clamp((radius - 0.1) / 1.45, 0, 1);
        outwardFactor = outward;
        const sideShade = Math.pow(Math.abs(u), 0.75) * 0.24;
        const shade = THREE.MathUtils.clamp(
          Math.max(
            Math.pow(edgeFactor, 0.75) * 0.5,
            Math.pow(outward, 0.78) * 0.68
          ) + sideShade + cfg.colorShift,
          0,
          1
        );
        color.copy(centerColor).lerp(edgeColor, shade);

        // 花苞：三层花瓣螺旋包裹，外层大、内层小
        const budT = 0.03 + rand() * 0.94;
        let budAngle = petal * (Math.PI * 2 / 6) + cfg.angle * 0.55
          + (1 - budT) * 1.4 + u * 0.38 + (rand() - 0.5) * 0.04;
        let budRadius = 0.5 * Math.pow(Math.sin(Math.PI * budT), 0.62)
          * (0.82 + rand() * 0.12) * cfg.radiusScale;
        budRadius += Math.abs(u) * Math.sin(Math.PI * budT) * 0.045;
        by += layer * 0.028;
        budAngle += Math.sin(budT * Math.PI * 1.5) * 0.045;
        if (budT > 0.9) by += (budT - 0.9) * 0.12;
        bx = Math.cos(budAngle) * budRadius;
        bz = Math.sin(budAngle) * budRadius;
        by += -1.05 + 2.0 * budT;

        color.lerp(edgeColor, budT * 0.16 + layer * 0.03);
        outwardFactor = Math.max(outwardFactor, budT * 0.3);
        delay = 0.02 + cfg.delay + (1 - budT) * 0.42 + petal * 0.025 + rand() * 0.05;
        size = (0.009 + rand() * 0.019) * cfg.sizeScale;
        if (edgeFactor < 0.3) size += 0.0025;
      } else if (isCore) {
        // 花蕊：花苞阶段隐藏，盛开后才显现金色
        coreFlag = 1;
        const br = 0.18 * Math.cbrt(rand());
        const ba = rand() * Math.PI * 2;
        const bp = Math.acos(rand() * 2 - 1);
        bx = Math.sin(bp) * Math.cos(ba) * br;
        by = Math.cos(bp) * br * 0.75;
        bz = Math.sin(bp) * Math.sin(ba) * br;

        const fr = 0.24 * Math.cbrt(rand());
        const fa = rand() * Math.PI * 2;
        const fp = Math.acos(rand() * 2 - 1);
        fx = Math.sin(fp) * Math.cos(fa) * fr;
        fy = Math.cos(fp) * fr * 0.52 + 0.02;
        fz = Math.sin(fp) * Math.sin(fa) * fr;

        color.copy(corePalette[Math.floor(rand() * corePalette.length)]);
        delay = 0.01 + rand() * 0.06;
        size = 0.011 + rand() * 0.012;
      } else {
        // 稀疏花粉
        const h = rand() * 2 - 1;
        const r = 0.82 + rand() * 0.38;
        const a = rand() * Math.PI * 2;
        bx = Math.cos(a) * r * Math.sqrt(Math.max(0, 1 - h * h));
        by = h * 1.08;
        bz = Math.sin(a) * r * Math.sqrt(Math.max(0, 1 - h * h));

        const fa = rand() * Math.PI * 2;
        const fr = 1.55 + rand() * 0.85;
        const fh = rand() * 2 - 1;
        fx = Math.cos(fa) * fr * Math.sqrt(Math.max(0, 1 - fh * fh));
        fy = fh * fr * 0.7 + 0.08;
        fz = Math.sin(fa) * fr * Math.sqrt(Math.max(0, 1 - fh * fh));

        color.copy(dustPalette[Math.floor(rand() * dustPalette.length)]);
        edgeFactor = 0.25;
        outwardFactor = 1.0;
        delay = 0.25 + rand() * 0.45;
        size = 0.008 + rand() * 0.013;
      }

      budPositions[i3] = bx;
      budPositions[i3 + 1] = by;
      budPositions[i3 + 2] = bz;
      fullPositions[i3] = fx;
      fullPositions[i3 + 1] = fy;
      fullPositions[i3 + 2] = fz;

      colors[i3] = color.r;
      colors[i3 + 1] = color.g;
      colors[i3 + 2] = color.b;
      delays[i] = delay;
      sizes[i] = size;
      seeds[i] = rand();
      edgeFactors[i] = edgeFactor;
      outwardFactors[i] = outwardFactor;
      rimFactors[i] = rimFactor;
      layerFactors[i] = layerFactor;
      coreFlags[i] = coreFlag;
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(budPositions.slice(), 3));
    particleGeometry.setAttribute('aPosBud', new THREE.BufferAttribute(budPositions, 3));
    particleGeometry.setAttribute('aPosFull', new THREE.BufferAttribute(fullPositions, 3));
    particleGeometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
    particleGeometry.setAttribute('aDelay', new THREE.BufferAttribute(delays, 1));
    particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    particleGeometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
    particleGeometry.setAttribute('aEdge', new THREE.BufferAttribute(edgeFactors, 1));
    particleGeometry.setAttribute('aOutward', new THREE.BufferAttribute(outwardFactors, 1));
    particleGeometry.setAttribute('aRim', new THREE.BufferAttribute(rimFactors, 1));
    particleGeometry.setAttribute('aLayer', new THREE.BufferAttribute(layerFactors, 1));
    particleGeometry.setAttribute('aCore', new THREE.BufferAttribute(coreFlags, 1));
    particleGeometry.computeBoundingSphere();

    const particleUniforms = {
      uBloom: { value: 0.04 },
      uTime: { value: 0 },
      uPixelRatio: { value: PIXEL_RATIO },
      uHand: { value: new THREE.Vector2(0, 0) },
      uHandAmount: { value: 0 },
      uPointer: { value: new THREE.Vector3(0, 0, 0) },
      uPointerActive: { value: 0 }
    };

    const particleMaterial = new THREE.ShaderMaterial({
      uniforms: particleUniforms,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        uniform float uBloom;
        uniform float uTime;
        uniform float uPixelRatio;
        uniform vec2 uHand;
        uniform float uHandAmount;
        uniform vec3 uPointer;
        uniform float uPointerActive;

        attribute vec3 aPosBud;
        attribute vec3 aPosFull;
        attribute vec3 aColor;
        attribute float aDelay;
        attribute float aSize;
        attribute float aSeed;
        attribute float aEdge;
        attribute float aOutward;
        attribute float aRim;
        attribute float aLayer;
        attribute float aCore;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          // 分批开花：aDelay 越大的粒子越晚启动
          float delay = aDelay * 0.82;
          float local = clamp((uBloom - delay) / max(0.001, 0.96 - delay), 0.0, 1.0);
          local = local * local * (3.0 - 2.0 * local);
          float eased = 1.0 - pow(1.0 - local, 3.0);

          vec3 pos = mix(aPosBud, aPosFull, eased);

          // 微弱漂浮与回旋
          float drift = mix(0.018, 0.085, eased);
          pos.x += sin(uTime * 0.55 + aSeed * 31.4 + pos.y * 1.8) * drift;
          pos.y += cos(uTime * 0.43 + aSeed * 17.1 + pos.x * 2.0) * drift * 0.7;
          pos.z += sin(uTime * 0.37 + aSeed * 23.7 + pos.y * 2.4) * drift * 0.8;

          // 手掌位置牵引：只改 shader 内位移，不碰 CPU 粒子位置
          float handPull = uHandAmount * (0.035 + eased * 0.075);
          pos.x += uHand.x * handPull;
          pos.y += uHand.y * handPull * 0.72;
          pos.z += uHand.x * uHandAmount * 0.035;
          pos.x += sin(uTime * 1.7 + aSeed * 10.0) * 0.008 * uHandAmount;

          // 呼吸式膨胀
          pos *= 1.0 + eased * 0.025 * sin(uTime * 1.1 + aSeed * 6.283);

          // 掌心光点触碰：距离越近越亮，和开花程度无关
          float pointerDist = distance(pos, uPointer);
          float touch = smoothstep(0.46, 0.02, pointerDist) * uPointerActive;

          // 粒子被光点轻轻推开，并产生一圈细微涟漪
          if (pointerDist > 0.001) {
            vec3 away = (pos - uPointer) / pointerDist;
            float ripple = 0.5 + 0.5 * sin(pointerDist * 22.0 - uTime * 4.0);
            pos += away * touch * (0.09 + ripple * 0.04);
          }

          // 翻瓣时带一点回旋，不是纯直线插值
          float petalAngle = atan(aPosBud.z, aPosBud.x);
          float curl = sin(3.14159265 * local) * 0.11;
          pos.x += sin(petalAngle) * curl * (0.25 + 0.75 * eased);
          pos.z += cos(petalAngle) * curl * (0.25 + 0.75 * eased);
          pos.y += sin(3.14159265 * local) * 0.025 * sin(aSeed * 17.0);

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float pulse = 0.9 + 0.1 * sin(uTime * 1.35 + aSeed * 12.0);
          float pointSize = aSize * (900.0 / max(1.0, -mvPosition.z)) * uPixelRatio;
          gl_PointSize = clamp(pointSize * pulse * (1.0 + touch * 0.42), 1.0, 34.0);

          // 花苞阶段隐藏金色花蕊，盛开后才慢慢亮起
          float coreReveal = mix(1.0, smoothstep(0.1, 0.55, uBloom), aCore);
          vColor = aColor * mix(0.28, 1.0, coreReveal);
          // 每层不同的光量：外暗、内亮，形成同心层次
          float layerLight = mix(0.82, 1.08, aLayer * 0.5);
          vColor *= layerLight;
          // 瓣缘描边：让三层花瓣的轮廓有可见的光边
          vColor = mix(vColor, vec3(1.0, 0.83, 0.9), aRim * 0.65);
          vColor = mix(vColor, vec3(1.0, 0.76, 0.85), touch * 0.23);

          float edgeFade = (1.0 - aEdge * 0.18) * (1.0 + aRim * 0.45);
          float outwardFade = mix(1.0, 0.42, aOutward);
          vAlpha = mix(0.56, 1.0, eased) * (0.82 + 0.18 * sin(uTime * 1.2 + aSeed * 9.0));
          vAlpha *= edgeFade * outwardFade * mix(0.3, 1.0, coreReveal);
          vAlpha *= mix(0.82, 1.02, aLayer * 0.5);
          vAlpha *= 1.0 + touch * 0.5;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float d = length(p) * 2.0;
          if (d > 1.0) discard;

          float core = pow(1.0 - d, 2.6);
          float halo = pow(1.0 - d, 1.0) * 0.32;
          float alpha = (core + halo) * vAlpha;
          if (alpha < 0.008) discard;

          gl_FragColor = vec4(vColor * (1.0 + core * 0.6), alpha);
        }
      `
    });

    const flowerPoints = new THREE.Points(particleGeometry, particleMaterial);
    flower.add(flowerPoints);

    // 三层半透明花瓣面：给粒子云一个真实的瓣形底，避免只剩一团光雾
    const petalMeshes = [];
    const petalMeshMaterial = new THREE.ShaderMaterial({
      uniforms: { uOpacity: { value: 0 } },
      vertexShader: `
        attribute vec3 aColor;
        attribute float aAlpha;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vColor = aColor;
          vAlpha = aAlpha;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uOpacity;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          gl_FragColor = vec4(vColor, vAlpha * uOpacity);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    });

    for (let layer = 0; layer < petalLayers.length; layer++) {
      const cfg = petalLayers[layer];
      const centerColor = centerPalette[layer % centerPalette.length];
      const edgeColor = edgePalette[layer % edgePalette.length];
      for (let petal = 0; petal < 6; petal++) {
        const theta = petal * (Math.PI * 2 / 6) + cfg.angle;
        const dirX = Math.cos(theta);
        const dirY = Math.sin(theta);
        const tanX = -Math.sin(theta);
        const tanY = Math.cos(theta);
        const rows = 16;
        const cols = 12;
        const positions = [];
        const colors = [];
        const alphas = [];
        const indices = [];
        for (let i = 0; i <= rows; i++) {
          const s = i / rows;
          const widthProfile = Math.pow(Math.sin(Math.PI * Math.pow(s, 0.72)), 0.56)
            + 0.05 * Math.pow(s, 8);
          const halfWidth = cfg.width * widthProfile * (0.72 + 0.28 * s);
          const radius = cfg.base + cfg.length * s;
          for (let j = 0; j <= cols; j++) {
            const u = j / cols * 2 - 1;
            const cup = cfg.cup * Math.sin(Math.PI * s) * (1 - u * u);
            positions.push(
              dirX * radius + tanX * u * halfWidth,
              dirY * radius + tanY * u * halfWidth,
              cfg.z + cup
            );
            const absU = Math.abs(u);
            const shade = Math.max(absU * 0.62, Math.pow(s, 1.2) * 0.3);
            const col = centerColor.clone().lerp(edgeColor, shade);
            colors.push(col.r, col.g, col.b);
            alphas.push((1 - Math.pow(absU, 2.4)) * (0.55 + 0.45 * Math.sin(Math.PI * s)));
          }
        }
        for (let i = 0; i < rows; i++) {
          for (let j = 0; j < cols; j++) {
            const a = i * (cols + 1) + j;
            const b = a + 1;
            const c = a + cols + 1;
            const d = c + 1;
            indices.push(a, b, c, b, d, c);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));
        geo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(alphas, 1));
        geo.setIndex(indices);
        const mesh = new THREE.Mesh(geo, petalMeshMaterial.clone());
        mesh.renderOrder = 2;
        mesh.visible = false;
        // 花瓣面先不叠加：避免平面色块把粒子层次盖住
        petalMeshes.push(mesh);
      }
    }

    // 掌心光点：Canvas 生成的柔光，不依赖图片资源
    const pointerCanvas = document.createElement('canvas');
    pointerCanvas.width = pointerCanvas.height = 128;
    const pointerCtx = pointerCanvas.getContext('2d');
    const pointerGradient = pointerCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
    pointerGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    pointerGradient.addColorStop(0.16, 'rgba(255, 225, 238, 0.95)');
    pointerGradient.addColorStop(0.48, 'rgba(255, 145, 190, 0.42)');
    pointerGradient.addColorStop(1, 'rgba(255, 105, 170, 0)');
    pointerCtx.fillStyle = pointerGradient;
    pointerCtx.fillRect(0, 0, 128, 128);
    const pointerTexture = new THREE.CanvasTexture(pointerCanvas);
    pointerTexture.colorSpace = THREE.SRGBColorSpace;

    const pointerSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: pointerTexture,
      color: 0xffd4e3,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    }));
    pointerSprite.scale.set(0.18, 0.18, 1);
    pointerSprite.renderOrder = 8;
    pointerSprite.visible = false;
    scene.add(pointerSprite);

    // 中心花蕊的圆形柔光，让核心更像一颗光球而不是一条亮带
    const centerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: pointerTexture,
      color: 0xffd39a,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    }));
    centerGlow.position.set(0, 0.02, 0);
    centerGlow.scale.setScalar(0.42);
    centerGlow.renderOrder = 7;
    centerGlow.visible = false;
    scene.add(centerGlow);

    // -------------------------------------------------------------------------
    // 状态与交互
    // -------------------------------------------------------------------------
    let mode = 'idle';               // idle | loading | camera | mouse
    let cameraSession = 0;
    let bloomValue = 0.04;
    let bloomTarget = 0.04;
    let manualTarget = 0.04;

    let handLandmarker = null;
    let cameraStream = null;
    let tracking = false;
    let handPresent = false;
    let lastHandAt = 0;
    let handSmooth = 0;
    let handOpenState = false;
    let handTarget = 0.04;
    let handX = 0;
    let handY = 0;
    let handXTarget = 0;
    let handYTarget = 0;
    let handAmount = 0;
    let handAmountTarget = 0;
    let pointerTarget = new THREE.Vector3(0, 0, 0);
    let pointerPosition = new THREE.Vector3(0, 0, 0);
    let pointerAmount = 0;
    let pointerAmountTarget = 0;
    let lastVideoTime = -1;
    let lastDetectAt = 0;

    function pointerFromScreen(sx, sy) {
      const ndc = new THREE.Vector3(sx * 2 - 1, -(sy * 2 - 1), 0.5).unproject(camera);
      const dir = ndc.sub(camera.position).normalize();
      const t = -camera.position.z / dir.z;
      pointerTarget.copy(camera.position).addScaledVector(dir, t);
    }

    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const cameraPanel = document.getElementById('cameraPanel');
    const cameraVideo = document.getElementById('cameraVideo');
    const handCanvas = document.getElementById('handCanvas');
    const handCtx = handCanvas.getContext('2d');
    const trackState = document.getElementById('trackState');
    const welcome = document.getElementById('welcome');
    const welcomeNote = document.getElementById('welcomeNote');
    const startBtn = document.getElementById('startBtn');
    const skipBtn = document.getElementById('skipBtn');
    const bloomSlider = document.getElementById('bloomSlider');
    const bloomOutput = document.getElementById('bloomOutput');

    if (location.protocol === 'file:') {
      welcomeNote.textContent = '点击后请在浏览器弹窗中允许摄像头；首次加载手部模型需要等待一会儿。';
    }

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17]
    ];

    function setModeBadge(text, live) {
      modeBadge.textContent = text;
      modeBadge.classList.toggle('live', Boolean(live));
    }

    function setStatus(text, muted = false) {
      statusText.textContent = text;
      statusText.classList.toggle('muted', muted);
    }

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          setTimeout(() => reject(new Error(`${label} 超时`)), ms);
        })
      ]);
    }

    function setBloomUI(value) {
      const percent = Math.round(value * 100);
      bloomOutput.textContent = `${percent}%`;
      bloomSlider.value = value.toFixed(3);
    }

    // 滑块始终可用，作为调试 / 鼠标模式输入
    bloomSlider.addEventListener('input', () => {
      manualTarget = parseFloat(bloomSlider.value);
      handTarget = manualTarget;
      bloomTarget = manualTarget;
      lastHandAt = 0;
      setStatus(
        mode === 'camera'
          ? '滑块调试模式 · 手势会接管绽放'
          : '鼠标模式 · 拖动滑块或横向拖拽',
        false
      );
      setBloomUI(manualTarget);
    });

    function enterMouseMode(reason = '') {
      cameraSession++;
      tracking = false;
      handPresent = false;
      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }
      cameraVideo.srcObject = null;
      cameraPanel.classList.add('is-hidden');
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      mode = 'mouse';
      handAmountTarget = 0;
      handXTarget = 0;
      handYTarget = 0;
      pointerAmountTarget = 0;
      document.body.classList.add('mouse-mode');
      setModeBadge('MOUSE', false);
      bloomTarget = Math.max(0.08, bloomValue);
      manualTarget = bloomTarget;
      setBloomUI(manualTarget);
      setStatus('鼠标模式 · 按住画面并左右拖拽', false);
      welcome.classList.add('is-gone');
      if (reason) welcomeNote.textContent = reason;
    }

    async function startCamera() {
      if (mode === 'loading' || mode === 'camera') return;
      const session = ++cameraSession;
      mode = 'loading';
      startBtn.disabled = true;
      setModeBadge('CONNECTING', false);
      setStatus('正在请求摄像头权限…', true);
      welcomeNote.textContent = '等待摄像头权限…';

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('当前浏览器不支持摄像头');
        }

        cameraStream = await withTimeout(
          navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: 'user',
              width: { ideal: 640 },
              height: { ideal: 480 }
            }
          }),
          12000,
          '摄像头权限'
        );

        if (session !== cameraSession) {
          cameraStream?.getTracks().forEach((track) => track.stop());
          cameraStream = null;
          return;
        }

        cameraVideo.srcObject = cameraStream;
        await cameraVideo.play();
        if (session !== cameraSession) return;
        cameraPanel.classList.remove('is-hidden');
        setStatus('正在加载手部模型…', true);

        // 动态加载 MediaPipe：失败时可以可靠地降级到鼠标模式
        const visionModule = await import(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
        );
        const vision = await visionModule.FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
        );
        handLandmarker = await withTimeout(
          visionModule.HandLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath:
                'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
            },
            runningMode: 'VIDEO',
            numHands: 1,
            minHandDetectionConfidence: 0.5,
            minHandPresenceConfidence: 0.5,
            minTrackingConfidence: 0.5
          }),
          90000,
          '手部模型加载'
        );

        if (session !== cameraSession) {
          cameraStream?.getTracks().forEach((track) => track.stop());
          cameraStream = null;
          cameraPanel.classList.add('is-hidden');
          return;
        }

        mode = 'camera';
        tracking = true;
        handPresent = false;
        handSmooth = 0;
        handOpenState = false;
        handTarget = 0.04;
        lastHandAt = performance.now();
        setModeBadge('CAMERA', true);
        setStatus('手掌张开 = 绽放 · 握拳 = 收拢 · 移动手掌 = 牵引', false);
        welcome.classList.add('is-gone');
        requestAnimationFrame(detectLoop);
      } catch (error) {
        if (session !== cameraSession) return;
        console.warn('[Fingertip Bloom] 摄像头/MediaPipe 不可用:', error);
        enterMouseMode('摄像头或手部模型不可用，已切换到鼠标模式。');
      }
    }

    function detectLoop(now) {
      if (!tracking) return;

      if (cameraVideo.readyState >= 2 && handLandmarker) {
        const videoTime = cameraVideo.currentTime;
        if (videoTime !== lastVideoTime) {
          lastVideoTime = videoTime;
          const dt = Math.min(0.05, Math.max(0.001, (now - lastDetectAt) / 1000));
          lastDetectAt = now;
          try {
            const result = handLandmarker.detectForVideo(cameraVideo, now);
            if (result.landmarks && result.landmarks.length > 0) {
              const lm = result.landmarks[0];
              handPresent = true;
              lastHandAt = now;

              // 张开度：食指指尖(8) 到掌心(0) 的距离。
              // 用同手 0-9 距离做尺度归一化，避免手掌大小/镜头远近导致误判。
              const tip = lm[8];
              const palm = lm[0];
              const midMcp = lm[9];

              // 掌心中心（0/5/9/13/17）比指尖稳定，握拳时也能保留光点
              const palmIds = [0, 5, 9, 13, 17];
              let palmX = 0;
              let palmY = 0;
              for (const id of palmIds) {
                palmX += lm[id].x;
                palmY += lm[id].y;
              }
              palmX /= palmIds.length;
              palmY /= palmIds.length;

              // 手掌位置驱动花的倾斜和位移；镜像到屏幕方向
              handXTarget = THREE.MathUtils.clamp((0.5 - palmX) * 2, -1, 1);
              handYTarget = THREE.MathUtils.clamp((0.5 - palmY) * 2, -1, 1);
              handAmountTarget = 1;

              // 掌心光点映射到花所在的 3D 平面
              pointerFromScreen(1 - palmX, palmY);
              pointerAmountTarget = 1;
              const d = Math.hypot(tip.x - palm.x, tip.y - palm.y);
              const span = Math.max(0.025, Math.hypot(midMcp.x - palm.x, midMcp.y - palm.y));
              const ratio = d / span;
              const rawOpen = THREE.MathUtils.smoothstep(ratio, 0.9, 1.8);

              // EMA 指数平滑
              handSmooth += (rawOpen - handSmooth) * (1 - Math.exp(-dt * 11));

              // 双阈值迟滞，抑制抖动
              if (!handOpenState && handSmooth > 0.62) handOpenState = true;
              else if (handOpenState && handSmooth < 0.37) handOpenState = false;
              handTarget = handOpenState ? 0.98 : 0.04;

              drawHand(lm);
              trackState.textContent = handOpenState ? 'OPEN' : 'FIST';
            } else {
              handPresent = false;
              drawHand(null);
              trackState.textContent = 'NO HAND';
            }
          } catch (error) {
            // 单帧检测异常不切换模式，避免摄像头偶发丢帧导致闪断
          }
        }
      }

      requestAnimationFrame(detectLoop);
    }

    function drawHand(landmarks) {
      const w = handCanvas.width;
      const h = handCanvas.height;
      handCtx.clearRect(0, 0, w, h);
      if (!landmarks) return;

      // 摄像头画面被 CSS 镜像，骨架坐标也镜像
      const points = landmarks.map((lm) => ({
        x: (1 - lm.x) * w,
        y: lm.y * h
      }));

      handCtx.lineWidth = 2;
      handCtx.lineCap = 'round';
      handCtx.strokeStyle = 'rgba(255, 104, 166, 0.9)';
      handCtx.shadowColor = 'rgba(255, 104, 166, 0.75)';
      handCtx.shadowBlur = 8;

      for (const [a, b] of HAND_CONNECTIONS) {
        handCtx.beginPath();
        handCtx.moveTo(points[a].x, points[a].y);
        handCtx.lineTo(points[b].x, points[b].y);
        handCtx.stroke();
      }

      handCtx.shadowBlur = 0;
      handCtx.fillStyle = '#ffd5e4';
      for (const p of points) {
        handCtx.beginPath();
        handCtx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        handCtx.fill();
      }
    }

    startBtn.addEventListener('click', startCamera);
    skipBtn.addEventListener('click', () => enterMouseMode('已进入鼠标模式。'));

    // -------------------------------------------------------------------------
    // 鼠标拖拽降级
    // -------------------------------------------------------------------------
    let dragging = false;
    let dragStartX = 0;
    let dragStartBloom = 0;

    canvas.addEventListener('pointerdown', (event) => {
      if (mode !== 'mouse') return;
      pointerFromScreen(event.clientX / innerWidth, event.clientY / innerHeight);
      pointerAmountTarget = 1;
      dragging = true;
      dragStartX = event.clientX;
      dragStartBloom = bloomValue;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (mode === 'mouse') {
        pointerFromScreen(event.clientX / innerWidth, event.clientY / innerHeight);
        pointerAmountTarget = 1;
      }
      if (!dragging || mode !== 'mouse') return;
      const delta = (event.clientX - dragStartX) / Math.max(320, innerWidth);
      manualTarget = THREE.MathUtils.clamp(dragStartBloom + delta * 1.65, 0, 1);
      bloomTarget = manualTarget;
      setBloomUI(manualTarget);
    });

    const endDrag = (event) => {
      dragging = false;
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // -------------------------------------------------------------------------
    // 状态推进 + 渲染
    // -------------------------------------------------------------------------
    function updateBloom(dt, now) {
      if (mode === 'camera') {
        if (handPresent) {
          bloomTarget = handTarget;
          handAmountTarget = 1;
        } else if (now - lastHandAt > 650) {
          // 手消失：先维持，之后缓慢回落，不完全归零
          handTarget = Math.max(0.035, handTarget - dt * 0.13);
          bloomTarget = handTarget;
          handAmountTarget = 0;
          pointerAmountTarget = 0;
          if (now - lastHandAt > 1200) {
            setStatus('未检测到手 · 缓慢回落', true);
          }
        } else {
          bloomTarget = handTarget;
        }
      } else if (mode === 'mouse') {
        bloomTarget = manualTarget;
      } else {
        bloomTarget = manualTarget;
      }

      const speed = mode === 'camera' ? 2.1 : 3.2;
      bloomValue += (bloomTarget - bloomValue) * (1 - Math.exp(-dt * speed));
      particleUniforms.uBloom.value = bloomValue;
      setBloomUI(bloomValue);
    }

    function animate(now) {
      const dt = Math.min(0.05, Math.max(0.001, (now - (animate.last || now)) / 1000));
      animate.last = now;
      const time = now * 0.001;

      updateBloom(dt, now);

      particleUniforms.uTime.value = time;
      backdropUniforms.uTime.value = time;

      // 手掌位置平滑跟随，花会向手的方向轻轻倾斜
      handX += (handXTarget - handX) * (1 - Math.exp(-dt * 4.5));
      handY += (handYTarget - handY) * (1 - Math.exp(-dt * 4.5));
      handAmount += (handAmountTarget - handAmount) * (1 - Math.exp(-dt * 3.2));
      particleUniforms.uHand.value.set(handX, handY);
      particleUniforms.uHandAmount.value = handAmount;

      pointerAmount += (pointerAmountTarget - pointerAmount) * (1 - Math.exp(-dt * 4.2));
      pointerPosition.lerp(pointerTarget, 1 - Math.exp(-dt * 8));
      pointerSprite.position.copy(pointerPosition);
      pointerSprite.visible = pointerAmount > 0.02;
      particleUniforms.uPointerActive.value = pointerAmount;

      const idleY = Math.sin(time * 0.17) * 0.055;
      const idleX = Math.sin(time * 0.11) * 0.018;
      flower.rotation.y = idleY + handX * handAmount * 0.34;
      flower.rotation.x = idleX - handY * handAmount * 0.18;
      flower.position.x = handX * handAmount * 0.28;
      flower.position.y = -handY * handAmount * 0.15;

      // 光点在花局部空间的坐标，供着色器计算触碰亮度
      flower.updateMatrixWorld();
      const localPointer = pointerPosition.clone();
      flower.worldToLocal(localPointer);
      particleUniforms.uPointer.value.copy(localPointer);

      // 光点进入花的范围时轻微放大，离开后平滑恢复
      const pointerRadius = Math.hypot(localPointer.x, localPointer.y);
      const pointerProximity = THREE.MathUtils.clamp(
        1 - (pointerRadius - 0.35) / 1.65,
        0,
        1
      );
      const pointerScale = 1 + pointerProximity * pointerAmount * 0.34;
      pointerSprite.scale.setScalar((0.15 + pointerAmount * 0.035) * pointerScale);
      pointerSprite.material.opacity = pointerAmount * (0.42 + pointerProximity * 0.2);

      const coreGlow = THREE.MathUtils.smoothstep(bloomValue, 0.08, 0.7);
      centerGlow.visible = coreGlow > 0.01;
      centerGlow.material.opacity = coreGlow * 0.14;
      centerGlow.scale.setScalar(0.26 + bloomValue * 0.1);

      for (const mesh of petalMeshes) {
        mesh.visible = false;
      }

      camera.position.x = Math.sin(time * 0.12) * 0.06;
      camera.position.y = 0.52 + Math.sin(time * 0.16) * 0.035;
      camera.lookAt(0, 0.08, 0);

      composer.render();
      requestAnimationFrame(animate);
    }

    // -------------------------------------------------------------------------
    // Resize / 启动
    // -------------------------------------------------------------------------
    function resize() {
      const w = innerWidth;
      const h = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, IS_MOBILE ? 1.5 : 1.75);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h);
      composer.setPixelRatio(dpr);
      composer.setSize(w, h);
      particleUniforms.uPixelRatio.value = dpr;
    }
    addEventListener('resize', resize);

    setBloomUI(bloomValue);
    setStatus('点击开启摄像头，或先用鼠标体验', true);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
